name: Validate InstaTool

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run lint
      - name: Build frontend and server
        run: npm run build
      - name: Verify public Cloudflare API health and CORS
        run: |
          set -e
          base="https://instatool-public-api.sebastianzoth.workers.dev"
          curl --fail --show-error --silent --retry 3 --retry-delay 2 --max-time 20 "$base/api/health" -o /tmp/public-health.json
          node -e 'const j=require("/tmp/public-health.json"); if(j.status!=="ok" || j.service!=="instatool-public-api")process.exit(1)'
          curl --fail --show-error --silent -D /tmp/public-headers.txt -o /dev/null -H 'Origin: https://sebastisnzoth.github.io' "$base/api/health"
          grep -qi '^access-control-allow-origin: https://sebastisnzoth.github.io' /tmp/public-headers.txt
      - name: Smoke-test production API health and CORS
        run: |
          NODE_ENV=production PORT=31879 node dist/server.cjs > /tmp/instatool-api.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:31879/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          node -e 'const j=require("/tmp/health.json"); if(j.status!=="ok") process.exit(1)'
          curl -fsSi -H 'Origin: https://sebastisnzoth.github.io' http://127.0.0.1:31879/api/health | grep -qi 'access-control-allow-origin: https://sebastisnzoth.github.io'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://untrusted.example' http://127.0.0.1:31879/api/health)" = 403
      - name: Build GitHub Pages static frontend
        run: npm run build:pages
      - name: Confirm frontend artifact
        run: test -s dist/index.html && test -d dist/assets
      - uses: actions/upload-artifact@v4
        with:
          name: instatool-pages-preview
          path: dist/
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax check
        run: python -m compileall -q instaloader-master

  publish-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [frontend, python]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_API_BASE_URL: ${{ vars.INSTATOOL_API_BASE_URL || 'https://instatool-public-api.sebastianzoth.workers.dev' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v4
