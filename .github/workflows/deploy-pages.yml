name: Validate InstaTool

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run lint
      - name: Build frontend and server
        run: npm run build
      - name: Build GitHub Pages static frontend
        run: npm run build:pages
      - name: Confirm frontend artifact
        run: test -s dist/index.html && test -d dist/assets
      - uses: actions/upload-artifact@v4
        with:
          name: instatool-pages-preview
          path: dist/
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax check
        run: python -m compileall -q instaloader-master
